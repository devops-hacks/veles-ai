# Local fast gate - CI runs the same set (see .github/workflows/ci.yml).
# Install once: brew install pre-commit && pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: cef0300fd0fc4d2a87a85fa2093c6b283ea36f4b  # v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=2048"]     # *.gguf is gitignored; catch accidents
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: f0b5944bef86f50d875305821a0ab0d8c601e465  # v0.8.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: a23f6b85d0fdd5bb9d564e2579e678033debbdff  # v0.10.0.1
    hooks:
      - id: shellcheck

  - repo: https://github.com/adrienverge/yamllint
    rev: 81e9f98ffd059efe8aa9c1b1a42e5cce61b640c6  # v1.35.1
    hooks:
      - id: yamllint

  - repo: https://github.com/gitleaks/gitleaks
    rev: c2afd56bbe7ab11564107d34efac4bfde3e3c78d  # v8.24.0
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: sops-header
        name: sops-header
        entry: python3 scripts/check_sops_header.py
        language: system
        files: ^secrets/.*\.ya?ml$
