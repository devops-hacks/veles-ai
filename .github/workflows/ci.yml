# CI gates: lint + test + compose config. Authored to match
# docs/pr-tdd-playbook.md section 5.
# Runner labels are PINNED, never floating aliases: same anti-pattern
# class as floating action refs - the Ubuntu 26 label migration
# (actions/runner-images#14748) must be a deliberate ruling.
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6, full-SHA pin
        with:
          fetch-depth: 0              # gitleaks benefits from full history
          persist-credentials: false  # no step pushes
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0, full-SHA pin (node24)
        with:
          python-version: "3.12"
      - name: pre-commit (ruff, format, shellcheck, yamllint, gitleaks)
        run: |
          python -m pip install --upgrade pip pre-commit
          pre-commit run --all-files

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6, full-SHA pin
        with:
          persist-credentials: false   # no step pushes
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0, full-SHA pin (node24)
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Unit + contract tests with coverage gate
        run: pytest -q --cov=services --cov-report=term-missing --cov-fail-under=85
      - name: Shell specs (bats, when present)
        run: |
          if find tests -name '*.bats' | grep -q .; then
            sudo apt-get update -qq && sudo apt-get install -y -qq bats
            bats tests/
          else
            echo "no bats specs yet - skipped"
          fi

  config:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6, full-SHA pin
        with:
          persist-credentials: false   # no step pushes
      - name: Compose files must validate (pinned images, no missing contexts)
        run: |
          docker compose -f services/compose/memory.yml -f services/compose/gateway.yml config -q

  nix:
    runs-on: ubuntu-24.04
    env:
      NIX_CONFIG: "access-tokens = github.com=${{ github.token }}"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6, full-SHA pin
        with:
          persist-credentials: false   # no step pushes
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa  # v23, full-SHA pin
      - name: Strict eval (drvPath forces full option evaluation)
        run: nix eval --raw ./nix#darwinConfigurations.mac-ai.system.drvPath
