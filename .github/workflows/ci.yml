# CI gates: lint + test + compose config. Authored to match
# docs/pr-tdd-playbook.md section 5. The nix-eval gate lands in the
# next PR (flake convergence).
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4, full-SHA pin
        with:
          fetch-depth: 0              # gitleaks benefits from full history
          persist-credentials: false  # no step pushes
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5, full-SHA pin
        with:
          python-version: "3.12"
      - name: pre-commit (ruff, format, shellcheck, yamllint, gitleaks)
        run: |
          python -m pip install --upgrade pip pre-commit
          pre-commit run --all-files

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4, full-SHA pin
        with:
          persist-credentials: false   # no step pushes
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5, full-SHA pin
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Unit + contract tests with coverage gate
        run: pytest -q --cov=services --cov-report=term-missing --cov-fail-under=85
      - name: Shell specs (bats, when present)
        run: |
          if find tests -name '*.bats' | grep -q .; then
            sudo apt-get update -qq && sudo apt-get install -y -qq bats
            bats tests/
          else
            echo "no bats specs yet - skipped"
          fi

  config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4, full-SHA pin
        with:
          persist-credentials: false   # no step pushes
      - name: Compose files must validate (pinned images, no missing contexts)
        run: |
          docker compose -f services/compose/memory.yml -f services/compose/gateway.yml config -q

  nix:
    runs-on: ubuntu-latest
    env:
      NIX_CONFIG: "access-tokens = github.com=${{ github.token }}"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4, full-SHA pin
        with:
          persist-credentials: false   # no step pushes
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa  # v23, full-SHA pin
      - run: nix flake check --no-build ./nix
