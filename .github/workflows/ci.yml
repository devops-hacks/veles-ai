# CI gates: lint + test. Authored to match docs/pr-tdd-playbook.md section 5.
# Compose-validation and nix-eval gates are added in PR 1 (images pinned).
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # gitleaks benefits from full history
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pre-commit (ruff, format, shellcheck, yamllint, gitleaks)
        run: |
          python -m pip install --upgrade pip pre-commit
          pre-commit run --all-files

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Unit + contract tests with coverage gate
        run: pytest -q --cov=services --cov-report=term-missing --cov-fail-under=85
      - name: Shell specs (bats, when present)
        run: |
          if find tests -name '*.bats' | grep -q .; then
            sudo apt-get update -qq && sudo apt-get install -y -qq bats
            bats tests/
          else
            echo "no bats specs yet - skipped"
          fi
